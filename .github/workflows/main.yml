# .github/workflows/update.yml
name: Update passport data
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Run parser
        run: cd passport-index-parser && make upgrade

      - name: Commit changes
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A '*.csv' '*.json'
          git diff --cached --quiet || git commit -m "update $(date +%F)"
          git push
